# Windows RDP + Cloudflare **named tunnel**（固定域名）
#
# 跟 quick tunnel 的区别：
#   quick tunnel 每次运行都换随机 trycloudflare.com 域名；
#   named tunnel 的域名是你 Cloudflare 账号里的固定资产，每次跑都一样。
#
# 前置（只需做一次，见 README）：
#   1. 建一个专门的隧道（别和 nas-tunnel 等共用，否则连接会被负载均衡分摊到不同地方）
#        cloudflared tunnel create rdp-win
#   2. 给它绑一个固定域名（DNS 是 CNAME 到 <tunnel-id>.cfargotunnel.com）
#        cloudflared tunnel route dns rdp-win rdp.你的域名
#   3. 把连接器 token 存进仓库 Secrets：CF_TUNNEL_TOKEN
#        cloudflared tunnel token rdp-win
#
# 之后每次跑这个 workflow，runner 都会以同一个身份接入同一条隧道，
# 地址恒为 rdp.你的域名。

name: WINDOWS RDP - NAMED TUNNEL

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: '固定域名（只用于在日志里打印提示，实际由隧道配置决定）'
        required: false
        default: 'rdp.oriweb.cc'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          $ok = (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
          Write-Host "3389 listening: $ok"

      - name: Set Administrator Password
        run: |
          $pw = "${{ secrets.RDP_PASSWORD != '' && secrets.RDP_PASSWORD || 'P@ssw0rd123!' }}"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $pw -Force)
          Write-Host "password configured"

      - name: Run named tunnel + keep alive
        shell: pwsh
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if (-not $env:CF_TUNNEL_TOKEN) {
            Write-Host "::error::缺少 secrets.CF_TUNNEL_TOKEN —— 先 cloudflared tunnel token <name> 取出来存进仓库"
            exit 1
          }
          # 容忍复制时带入的换行/空格：这些字符会破坏 token 认证
          $tok = ($env:CF_TUNNEL_TOKEN -replace '\s','')
          Write-Host "token 字符数: $($tok.Length)   (期望 180)"

          # 指纹自检：先用本地解码 + 哈希，确认收到的是什么，再决定要不要连
          try {
            $obj = ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($tok))) | ConvertFrom-Json
            $sha1 = [BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash(
                      [Text.Encoding]::UTF8.GetBytes($obj.s))).Replace('-','').ToLower()
            $sha2 = [BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash(
                      [Text.Encoding]::UTF8.GetBytes($tok))).Replace('-','').ToLower()
            Write-Host "  tunnel id        : $($obj.t)"
            Write-Host "  secret sha256[16] : $($sha1.Substring(0,16))   (期望 d940d602eeae3235)"
            Write-Host "  token  sha256     : $sha2"
            Write-Host "                    (期望 88c83eb1b2758dae528aff1f7786e3709823b03da79612d353a7090d39da4904)"
            if ($obj.t -ne "365b63f9-9dfd-4520-a067-4effaef23f16") {
              Write-Host "::error::token 指向的隧道不是 rdp-win（$($obj.t)），Secret 贴错了"
              exit 1
            }
            if ($sha1.Substring(0,16) -ne "d940d602eeae3235") {
              Write-Host "::error::token 里的 secret 不对（指纹不匹配）—— Secret 内容有字符被改动"
              exit 1
            }
            Write-Host "  => token 自检通过"
          } catch {
            Write-Host "::error::token 不是合法的 base64 JSON: $($_.Exception.Message)"
            exit 1
          }

          $host_ = "${{ inputs.hostname }}"
          $err = Join-Path $env:RUNNER_TEMP "cf.err.log"
          Remove-Item $err -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath "cloudflared" `
                -ArgumentList "tunnel","--no-autoupdate","run","--token",$tok `
                -RedirectStandardError $err -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "cf.out.log") `
                -WindowStyle Hidden -PassThru

          # 等连接真正建立
          $connected = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            if (Select-String -Path $err -Pattern "Registered tunnel connection" -Quiet -ErrorAction SilentlyContinue) {
              $connected = $true; break
            }
            if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { break }
          }

          if (-not $connected) {
            Write-Host "::error::隧道没有建立连接，cloudflared 日志："
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 40
            exit 1
          }

          Write-Host "============================================"
          Write-Host "已接入固定隧道，地址恒定：https://$host_"
          Write-Host "用户名: runneradmin"
          Write-Host "客户端: cloudflared access tcp --hostname $host_ --url localhost:3389"
          Write-Host "============================================"
          @(
            "## Windows RDP ready (named tunnel)",
            "",
            "- 固定地址: ``$host_``",
            "- 连接: ``cloudflared access tcp --hostname $host_ --url localhost:3389``",
            "- 用户名: ``runneradmin``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          while ($true) {
            Start-Sleep -Seconds 60
            if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
              Write-Host "::error::cloudflared 退出，隧道断了"
              Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 30
              exit 1
            }
            Write-Host "alive $(Get-Date -Format 'HH:mm:ss')"
          }
