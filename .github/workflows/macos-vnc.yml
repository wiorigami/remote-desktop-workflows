# macOS VNC + bore.pub
#
# 为什么换 bore.pub：
#   - Cloudflare quick tunnel 是 TCP over WebSocket，手机上没有 cloudflared 客户端，连不上。
#   - bore 是纯 TCP 端口转发：`bore local 5900 --to bore.pub` → 得到一个 verdade 公网
#     `bore.pub:<port>`，任何 VNC 客户端（电脑/手机/平板）直接连，零安装。
#
# 端到端已验证（本机 macOS arm64 实测）：
#   bore local 5999 --to bore.pub
#   → INFO listening at bore.pub:36322
#   → 客户端连 bore.pub:36322，数据往返正常
#
# 安全提醒：bore.pub 是公开的免费服务，它把 VNC 端口**直接暴露在公网上**（随机端口），
#   任何扫描器都能敲到，而且 bore.pub 不负责加密。请务必换掉默认密码。
#   隧道只活在 job 期间（≤6h），但暴露的是真的公网端口。

name: macOS VNC - BORE.PUB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Install bore
        run: |
          set -uo pipefail
          # 官方客户端：brew 里就有官方包；装不上再退回 GitHub Releases 的预编译包。
          # 注意：这里装的是「客户端」，bore.pub 是作者托管的公共服务，不需要我们自建。
          if brew install bore-cli 2>/dev/null || brew list bore-cli >/dev/null 2>&1; then
            echo "installed via brew (bore-cli)"
          else
            echo "warn: brew failed, falling back to prebuilt release"
            ARCH=$(uname -m)
            case "$ARCH" in
              arm64)  ASSET="aarch64-apple-darwin" ;;
              x86_64) ASSET="x86_64-apple-darwin" ;;
              *) echo "::error::unsupported arch $ARCH"; exit 1 ;;
            esac
            TAG=$(curl -fsSL https://api.github.com/repos/ekzhang/bore/releases/latest \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
            curl -fsSL -o /tmp/bore.tar.gz \
              "https://github.com/ekzhang/bore/releases/download/${TAG}/bore-${TAG}-${ASSET}.tar.gz"
            tar -xzf /tmp/bore.tar.gz -C /tmp
            chmod +x /tmp/bore
            sudo mv /tmp/bore /usr/local/bin/bore
          fi
          which bore && bore --version
          sw_vers

      - name: Diagnose GUI session (before)
        run: |
          echo "console user : $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"
          echo "whoami       : $(whoami)"
          echo "arch         : $(uname -m)"
          who || true

      - name: Create admin user with known password
        env:
          USER_PASS: P@ssw0rd123!
        run: |
          set -uo pipefail
          U=vncuser
          if dscl . -read /Users/"$U" >/dev/null 2>&1; then
            echo "user ${U} already exists"
          else
            if sudo sysadminctl -addUser "$U" -fullName "VNC User" -password "$USER_PASS" -admin 2>&1; then
              echo "created ${U} via sysadminctl"
            else
              echo "warn: sysadminctl failed, falling back to dscl"
              NEWID=$(( $(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1) + 1 ))
              sudo dscl . -create /Users/"$U"
              sudo dscl . -create /Users/"$U" UserShell /bin/zsh
              sudo dscl . -create /Users/"$U" RealName "VNC User"
              sudo dscl . -create /Users/"$U" UniqueID "$NEWID"
              sudo dscl . -create /Users/"$U" PrimaryGroupID 20
              sudo dscl . -create /Users/"$U" NFSHomeDirectory /Users/"$U"
            fi
          fi
          sudo dscl . -passwd /Users/"$U" "$USER_PASS"
          sudo createhomedir -c -u "$U" >/dev/null 2>&1 || echo "warn: createhomedir failed"
          sudo dseditgroup -o edit -a "$U" -t user admin >/dev/null 2>&1 || echo "warn: add to admin failed"

          echo "--- 账户状态 ---"
          dscl . -read /Users/"$U" RecordName UniqueID PrimaryGroupID 2>/dev/null || true
          dscl . -read /Users/"$U" AuthenticationAuthority 2>/dev/null || echo "  (none)"

          if sudo dscl . -authonly "$U" "$USER_PASS" >/dev/null 2>&1; then
            echo "OK: dscl -authonly 通过"
          else
            echo "::error::dscl -authonly 失败，${U} 的密码不能用于认证"
            exit 1
          fi

      - name: Enable Screen Sharing
        env:
          VNC_PASS: P@ssw0rd123!
        run: |
          set -uo pipefail
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -configure -allowAccessFor -allUsers -privs -all || echo "warn: allowAccessFor failed"
          sudo "$KS" -configure -access -on -users vncuser -privs -all || echo "warn: explicit user grant failed"
          sudo "$KS" -configure -clientopts -setreqperm -reqperm no || echo "warn: reqperm failed"
          sudo "$KS" -configure -clientopts -setvnclegacy -vnclegacy yes || echo "warn: setvnclegacy failed"

          printf '%s' "$VNC_PASS" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt || true

          sudo "$KS" -restart -agent -console || echo "warn: restart agent failed"
          sudo "$KS" -activate || echo "warn: activate failed"
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 6

          echo "--- port 5900 ---"
          if sudo lsof -nP -iTCP:5900 -sTCP:LISTEN; then
            echo "OK: screensharing listening on 5900"
          else
            echo "::error::5900 没有监听"
            sudo launchctl list | grep -i -E "screensharing|remotedesktop" || echo "(no such job)"
            sudo "$KS" -status 2>&1 | head -30 || true
            exit 1
          fi

          echo "--- ARD status ---"
          sudo "$KS" -status 2>&1 | head -40 || true
          echo "console user: $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"

      - name: Start bore tunnel + self-test + keep alive
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/bore.log"
          bore local 5900 --to bore.pub > "$LOG" 2>&1 &
          BPID=$!
          TARGET=""
          for i in $(seq 1 30); do
            sleep 1
            TARGET=$(grep -oE 'bore\.pub:[0-9]+' "$LOG" 2>/dev/null | head -1 || true)
            [ -n "$TARGET" ] && break
            kill -0 "$BPID" 2>/dev/null || break
          done
          if [ -z "$TARGET" ]; then
            echo "::error::没拿到 bore 公网地址"
            cat "$LOG"
            exit 1
          fi
          PORT="${TARGET##*:}"

          echo "============================================"
          echo "BORE_TARGET=$TARGET"
          echo "账户 = vncuser / P@ssw0rd123!"
          echo "VNC 密码(legacy) = P@ssw0rd (前 8 位)"
          echo "============================================"
          {
            echo "## macOS VNC ready (bore.pub)"
            echo ""
            echo "- 地址: \`${TARGET}\`"
            echo "- 账户: \`vncuser\` / \`P@ssw0rd123!\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # 从 runner 自己穿一遍公网，确认隧道真的通（能读到 VNC banner 才算通）
          # 注意：YAML 的 run 块里不能塞顶格 heredoc / 多行 python，会把字面量块截断
          echo "--- 自检：经 bore.pub 回连 5900 ---"
          BANNER=$(nc -w 8 bore.pub "$PORT" 2>/dev/null | head -c 12 || true)
          echo "banner: [$BANNER]"
          case "$BANNER" in
            RFB*) echo "OK: 隧道从 runner 侧可达，VNC banner 正常" ;;
            *)    echo "warn: 没读到 RFB banner —— 隧道或屏幕共享服务有问题" ;;
          esac

          while true; do
            sleep 60
            if ! kill -0 "$BPID" 2>/dev/null; then
              echo "::error::bore 退出，隧道已失效"; tail -30 "$LOG"; exit 1
            fi
            echo "alive $(date +%H:%M:%S) target=${TARGET}"
          done
